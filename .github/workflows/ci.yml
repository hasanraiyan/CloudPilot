name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: cloudpilot
          POSTGRES_USER: cloudpilot
          POSTGRES_PASSWORD: cloudpilot-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloudpilot -d cloudpilot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping | grep PONG"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://cloudpilot:cloudpilot-ci-password@127.0.0.1:5432/cloudpilot
      REDIS_URL: redis://127.0.0.1:6379/0
      AUTH_SECRET: ci-only-secret-at-least-32-characters-long
      NEXT_PUBLIC_API_URL: http://localhost:8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate and validate Prisma schema
        run: |
          npm run db:generate
          npm run db:validate
          npm run db:migrate:deploy

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Build all workspaces
        run: npm run build

      - name: Run API unit tests
        run: node --import tsx --test apps/api/test/deployment-state-machine.test.ts apps/api/test/project-intelligence.test.ts
