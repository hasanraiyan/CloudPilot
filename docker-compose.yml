name: cloudpilot

services:
  postgres:
    image: postgres:15-alpine
    container_name: cloudpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudpilot}
      POSTGRES_USER: ${POSTGRES_USER:-cloudpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - cloudpilot_postgres_data:/var/lib/postgresql/data
    networks:
      - cloudpilot
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-cloudpilot} -d ${POSTGRES_DB:-cloudpilot}",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  redis:
    image: redis:7-alpine
    container_name: cloudpilot-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --appendonly
      - yes
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - cloudpilot_redis_data:/data
    networks:
      - cloudpilot
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

volumes:
  cloudpilot_postgres_data:
    name: cloudpilot_postgres_data
  cloudpilot_redis_data:
    name: cloudpilot_redis_data

networks:
  cloudpilot:
    name: cloudpilot-network
